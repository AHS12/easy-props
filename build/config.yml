# The app's name, version and other details for the build.
# After changing `info`, run `wails3 task common:update:build-assets` from the
# repository root, then delete the ios, android, linux and docker folders it adds.
# It rewrites the version in the Windows and Mac files and leaves the installer
# script, build/windows/nsis/project.nsi, as it is.
version: '3'

info:
  companyName: "easy-props"
  productName: "easy-props"
  productIdentifier: "com.easyprops.easy-props"
  description: "Make game-ready trees and props, with no 3D experience needed."
  copyright: "© 2026 AHS12"
  comments: "Make game-ready trees and props, with no 3D experience needed."
  version: "0.4.6"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - graphify-out
      - specs
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
